name: Automação de Testes do Blog

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  executar-testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkouts@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Depedencias
        run: npm ci
      - name: Rodar suite completa de testes
        run: npm test
    